name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt Pillow
      - name: Prepare branded application icon
        shell: pwsh
        run: |
          if (!(Test-Path "assets")) { New-Item -ItemType Directory -Path "assets" | Out-Null }
          @'
from PIL import Image, ImageDraw, ImageFilter
S=512
im=Image.new("RGBA",(S,S),(8,12,31,255))
d=ImageDraw.Draw(im)
# dark rounded-square background and neon frame
d.rounded_rectangle((12,12,500,500),radius=105,fill=(13,17,43,255),outline=(83,75,255,255),width=14)
# soft neon halo
glow=Image.new("RGBA",(S,S),(0,0,0,0)); g=ImageDraw.Draw(glow)
g.arc((90,65,422,397),180,360,fill=(0,210,255,230),width=32)
g.rounded_rectangle((75,215,160,390),radius=38,outline=(0,220,255,255),width=22)
g.rounded_rectangle((352,215,437,390),radius=38,outline=(255,45,210,255),width=22)
glow=glow.filter(ImageFilter.GaussianBlur(15)); im=Image.alpha_composite(im,glow)
d=ImageDraw.Draw(im)
d.arc((90,65,422,397),180,360,fill=(0,225,255,255),width=22)
d.rounded_rectangle((75,215,160,390),radius=38,outline=(0,225,255,255),width=20)
d.rounded_rectangle((352,215,437,390),radius=38,outline=(235,75,255,255),width=20)
# equalizer waveform
pts=[(175,286),(200,286),(218,246),(242,334),(268,218),(292,286),(333,286)]
d.line(pts,fill=(235,250,255,255),width=15,joint="curve")
for x,h in [(145,35),(190,54),(235,82),(280,54),(325,35)]:
 d.rounded_rectangle((x,410-h,x+25,410),radius=6,fill=(0,210,255,255))
d.polygon([(256,340),(221,380),(244,380),(244,421),(268,421),(268,380),(291,380)],fill=(0,220,255,255))
im.save("assets/DjShrek-Draiver.ico",format="ICO",sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
'@ | Set-Content -Encoding utf8 make_icon.py
          python make_icon.py
          if (!(Test-Path "assets/DjShrek-Draiver.ico")) { throw "ICO icon was not created" }
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name "DjShrek Draiver" --icon "assets/DjShrek-Draiver.ico" --collect-all PySide6 run.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build single-file installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer.iss
          if (!(Test-Path "dist\\installer\\DjShrek-Draiver-Setup.exe")) { throw "Installer EXE was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-Setup-Windows-x64
          path: dist/installer/DjShrek-Draiver-Setup.exe
          if-no-files-found: error
          retention-days: 30
