name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/neon-control-center
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate Cyber Club icons
        run: python app/build_branding.py
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name "DjShrek Draiver" --icon app/assets/DjShrek-Draiver.ico --add-data "app/assets;app/assets" --collect-all PySide6 run.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build single-file installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer.iss
          if (!(Test-Path "dist\installer\DjShrek-Draiver-Setup.exe")) { throw "Installer EXE was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-Setup-Windows-x64
          path: dist/installer/DjShrek-Draiver-Setup.exe
          if-no-files-found: error
          retention-days: 30
