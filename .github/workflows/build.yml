name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare branded application icon
        shell: pwsh
        run: |
          python -m pip install Pillow cairosvg
          python -c "import cairosvg; cairosvg.svg2png(url='assets/DjShrek-Draiver.svg', write_to='assets/DjShrek-Draiver.png', output_width=512, output_height=512)"
          python -c "from PIL import Image; im=Image.open('assets/DjShrek-Draiver.png').convert('RGBA'); im.save('assets/DjShrek-Draiver.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name "DjShrek Draiver" --icon "assets/DjShrek-Draiver.ico" --collect-all PySide6 run.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build single-file installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc installer.iss
          if (!(Test-Path "dist\installer\DjShrek-Draiver-Setup.exe")) { throw "Installer EXE was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: DjShrek-Draiver-Setup-Windows-x64
          path: dist/installer/DjShrek-Draiver-Setup.exe
          if-no-files-found: error
          retention-days: 30
